<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>百層日報</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<script src="pixel.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0f1117;--panel:#1a1d27;--line:#2c3140;--ink:#ebe8df;--dim:#8d91a0;--gold:#d9b45b;--red:#d9625b;--green:#6fbf8c;--blue:#6aa6d9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Hiragino Sans","Yu Gothic",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 80px}
h1{font:600 20px/1 "Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.2em;margin:6px 0 2px;color:var(--gold)}
.sub{color:var(--dim);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.card h2{font-size:13px;margin:0 0 8px;color:var(--dim);font-weight:600;letter-spacing:.08em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
button,input{font:inherit;color:var(--ink);background:#252937;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button{cursor:pointer}
button.primary{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
button.on{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:600}
button:disabled{opacity:.45;cursor:default}
.tabs{display:flex;gap:4px;margin:8px 0}
.tabs button{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.kv b{color:var(--dim);font-weight:400}
.item{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.item:first-child{border-top:0}
.item .nm{flex:1}
.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--dim)}
.msg{min-height:1.5em;color:var(--green);font-size:13px}
.msg.err{color:var(--red)}
.log{font-size:13px;color:#cfccc0;background:#0c0e14;border-radius:8px;padding:8px 12px;margin-top:6px}
.log div{padding:1px 0}
.floors{display:flex;gap:6px;flex-wrap:wrap}
.floors button{min-width:44px;padding:8px 6px}
.hide{display:none!important}
.dim{color:var(--dim)}
.lv{color:var(--gold);font-weight:600}
.bar{height:8px;background:#0c0d12;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--gold)}
.res-clear{color:var(--green)}.res-retreat{color:var(--gold)}.res-faint{color:var(--red)}
/* 冒険 */
.hpbar{height:14px;background:#0c0d12;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.hpbar i{display:block;height:100%;background:var(--green);transition:width .25s}
.hpbar.low i{background:var(--red)}
.hpbar.en i{background:var(--red)}
.big{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.big button{padding:12px 14px;text-align:left}
.big button small{display:block;color:var(--dim);font-size:12px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.acts button{padding:12px 8px}
.enemy{text-align:center;font-size:18px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;margin:2px 0 6px}
.intent{display:inline-block;border:1px solid var(--red);color:var(--red);border-radius:6px;padding:0 8px;font-size:13px;margin-top:6px}
.chip{display:inline-block;font-size:12px;border:1px solid var(--gold);color:var(--gold);border-radius:12px;padding:0 8px;margin:2px 4px 2px 0}
/* 紙芝居 */
#story{position:fixed;inset:0;background:#000;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center}
#story .frame{width:100%;max-width:560px}
#story .stage{width:100%;aspect-ratio:400/220;background:#000;overflow:hidden}
#story .stage svg{width:100%;height:100%;display:block}
#story .box{position:relative;margin:0 10px;margin-top:-14px;background:rgba(18,20,30,.96);border:2px solid #cdbb88;border-radius:10px;padding:14px 16px 26px;min-height:150px;cursor:pointer}
#story .who{position:absolute;top:-13px;left:14px;background:#cdbb88;color:#1a1405;font-weight:700;font-size:13px;padding:1px 12px;border-radius:6px}
#story .txt{font-size:16px;line-height:1.9;min-height:84px;white-space:pre-wrap}
#story .next{position:absolute;right:14px;bottom:6px;color:#cdbb88;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
#story .ask{margin-top:8px}
#story .skip{position:fixed;top:10px;right:12px;font-size:12px;background:transparent;border:1px solid #444;color:#999}
.portrait{position:absolute;right:12px;top:-62px;width:64px;height:64px}

.np{--paper:#f3ead6;--ink:#1d1a14;--rule:#3a3224;--accent:#8a1c1c;--dim:#6b604a;color:var(--ink);background:var(--paper);background-image:radial-gradient(rgba(120,90,40,.10) 1px,transparent 1px);background-size:5px 5px;
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","MS PMincho",serif;line-height:1.8;padding:14px 16px 18px;border:1px solid #b9ab88;border-radius:4px;box-shadow:0 4px 20px rgba(0,0,0,.4);margin-bottom:12px}
.np *{box-sizing:border-box}
.np .topline{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--dim);border-bottom:1px solid var(--rule);padding-bottom:3px;letter-spacing:.06em}
.np .mast{text-align:center;margin:8px 0 2px}.np .mast h1{margin:0;font-size:clamp(38px,11vw,72px);letter-spacing:.16em;font-weight:900;line-height:1.1;text-indent:.16em;color:var(--ink)}
.np .mast .en{font-size:10px;letter-spacing:.4em;color:var(--dim)}
.np .rule2{border-top:3px solid var(--rule);border-bottom:1px solid var(--rule);height:6px;margin:6px 0 10px}
.np .headline{text-align:center}.np .kicker{display:inline-block;background:var(--accent);color:#fff;font-size:12px;letter-spacing:.2em;padding:1px 10px}
.np .headline h2{margin:6px 0 2px;font-size:clamp(24px,6.4vw,44px);line-height:1.3;font-weight:900;color:var(--ink)}
.np .headline .sub{font-size:clamp(13px,2.6vw,16px);color:#3a3224}
.np .cols{display:grid;grid-template-columns:2fr 1fr;margin-top:10px;border-top:1px solid var(--rule)}
.np .main{padding:10px 14px 4px 0;border-right:1px solid var(--rule)}.np .side{padding:10px 0 4px 14px}
.np .main p{margin:0 0 .75em;text-align:justify;font-size:15.5px}.np .main p.lead::first-letter{float:left;font-size:3.2em;line-height:.85;padding:5px 7px 0 0;font-weight:900;color:var(--accent)}
.np h3{margin:12px 0 5px;font-size:16.5px;border-bottom:2px solid var(--rule);padding-bottom:2px;color:var(--ink)}
.np .quote{margin:12px 0;padding:6px 12px;border-left:5px solid var(--accent);font-size:17.5px;font-weight:700;line-height:1.6;background:rgba(138,28,28,.06)}.np .quote small{display:block;font-weight:400;font-size:11.5px;color:var(--dim)}
.np .box{border:1px solid var(--rule);padding:6px 10px;margin:0 0 12px;background:rgba(255,255,255,.28)}.np .box h3{margin-top:0}
.np table{width:100%;border-collapse:collapse;font-size:14px}.np td,.np th{padding:2px 3px;border-bottom:1px dotted #8a7d5e;text-align:left}.np th{font-size:11px;color:var(--dim);font-weight:400}
.np .bar{height:8px;background:#d9cca9;border:1px solid var(--rule);margin:2px 0 5px}.np .bar i{display:block;height:100%;background:var(--accent)}
.np .small{font-size:12.5px;color:var(--dim);line-height:1.6}
.np .ad{border:3px double var(--rule);text-align:center;padding:8px 6px;margin-bottom:12px;font-size:14px}.np .ad b{font-size:18px;display:block}
.np .strip{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:1px solid var(--rule);margin-top:4px;padding-top:10px}.np .strip h3{margin:0 0 3px}.np .strip p{margin:0 0 .5em;font-size:14.5px}
.np .foot{text-align:center;margin-top:12px;padding-top:8px;border-top:3px double var(--rule);font-size:14px}
.np ol.rk{margin:0;padding-left:1.4em;font-size:14px}
@media (max-width:640px){.np .cols,.np .strip{grid-template-columns:1fr}.np .main{border-right:none;padding-right:0}.np .side{padding-left:0;border-top:1px solid var(--rule)}}
.jackpot{margin:8px 0;padding:10px;border-radius:8px;text-align:center;font-weight:bold;color:#2b1d00;background:linear-gradient(90deg,#ffd45a,#fff1a8,#ffd45a);box-shadow:0 0 14px #ffd45a99}
.jackpot .jp-sub{font-weight:normal;font-size:13px;margin-top:2px}
/* ===== ドット絵テーマ ===== */
body{font-family:"DotGothic16","Hiragino Sans","Yu Gothic",system-ui,sans-serif;background:#161022;background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:8px 8px}
:root{--panel:#2a2034;--line:#1b1226;--gold:#f4c534;--green:#58c26a;--red:#e8604f}
h1{font-family:"DotGothic16",serif;letter-spacing:.3em;text-shadow:3px 3px 0 #000}
svg.px{image-rendering:pixelated;display:block;flex:none}
.card{border-radius:0;border:3px solid #1b1226;box-shadow:inset 0 0 0 2px #5a4a78,3px 3px 0 #0008;background:#2a2034}
button,input{border-radius:0;border:3px solid #1b1226;background:#4a3d66;box-shadow:inset -2px -2px 0 #0005,inset 2px 2px 0 #ffffff25;font-family:inherit}
button:active:not(:disabled){transform:translate(1px,1px)}
button.primary,button.on{background:#f4c534;color:#2b1d00;box-shadow:inset -2px -2px 0 #b9831c,inset 2px 2px 0 #fff3b0}
.bar,.hpbar{border-radius:0;border:2px solid #1b1226;background:#120b1c}.bar i{background:#f4c534}
.tabs button{padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.hud{display:flex;gap:10px;align-items:center}
.hud .who{flex:1;min-width:0}
.stat{display:flex;align-items:center;gap:4px;font-size:13px}
.hpb{height:10px;background:#120b1c;border:2px solid #1b1226;margin-top:3px;display:flex;gap:1px;padding:1px}.hpb i{flex:1;background:#58c26a}
.slots{display:flex;gap:6px;margin-top:6px;align-items:center;font-size:12px;color:#cfc8e0}
button.slot{background:#120b1c}.slot{width:42px;height:42px;background:#120b1c;border:3px solid #1b1226;box-shadow:inset 0 0 0 1px #5a4a78;display:flex;align-items:center;justify-content:center;position:relative}
.slot.on,.slot.eqd{box-shadow:inset 0 0 0 2px #f4c534}
.slot small{position:absolute;right:1px;bottom:-1px;font-size:10px;color:#fff;text-shadow:1px 1px 0 #000}
/* 塔 */
.tower{border:4px solid #1b1226;border-top:0;background:#3b3550;background-image:repeating-linear-gradient(0deg,#0003 0 2px,transparent 2px 22px),repeating-linear-gradient(90deg,#0002 0 2px,transparent 2px 28px);max-height:380px;overflow-y:auto;box-shadow:inset 0 0 0 3px #6b6385}
.tower .roof{height:16px;background:#6b6385;border-bottom:4px solid #1b1226;margin:0 -4px}
.fl{display:flex;align-items:center;gap:6px;width:100%;min-height:46px;padding:2px 8px;border:0;border-bottom:3px solid #1b1226;background:transparent;box-shadow:none;text-align:left;color:#ebe8df}
.fl .no{width:38px;font-size:15px;color:#f4c534;text-shadow:1px 1px 0 #000}
.fl .mid{flex:1;display:flex;align-items:center;gap:6px;min-width:0;font-size:12px;color:#cfc8e0}
.fl.sel{background:#f4c53433;box-shadow:inset 0 0 0 3px #f4c534}
.fl.fog{background:#120b1caa;color:#5a4a78;cursor:default}
.fl.front .no::after{content:"";}
.fl .hp{width:70px;height:8px;background:#120b1c;border:2px solid #1b1226}.fl .hp i{display:block;height:100%;background:#e8604f}
.fl .rt{font-size:11px;color:#ffe27a}
.hot{background:linear-gradient(90deg,#f4c53422,transparent)}
.item .nm{flex:1}
svg.px.inl{display:inline-block;vertical-align:middle}
.hero-bob{animation:bob .8s steps(2) infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.panel{margin-top:8px;padding:8px 10px;background:#120b1c;border:3px solid #1b1226;font-size:13px;line-height:1.6}
/* 店 */
.shopbox{position:relative;height:190px;border:4px solid #1b1226;overflow:hidden;box-shadow:inset 0 0 0 2px #5a4a78}
.shopbox .bg{position:absolute;inset:0}
.shopbox .toma{position:absolute;left:50%;bottom:6px;transform:translateX(-50%)}
.bubble{position:absolute;left:8px;right:8px;top:8px;background:#f6f1e6;color:#1b1226;border:3px solid #1b1226;padding:4px 10px;font-size:13px;line-height:1.5}
.bubble.err{background:#ffd6d0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cell{display:flex;gap:8px;align-items:center;background:#120b1c;border:3px solid #1b1226;padding:6px;min-width:0}
.cell .tx{flex:1;min-width:0;font-size:12px;line-height:1.4}.cell .tx b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell button{padding:4px 8px;font-size:12px}
.price{color:#f4c534}
.inv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.inv .slot{width:100%;height:auto;aspect-ratio:1}
.inv .slot.pick{box-shadow:inset 0 0 0 3px #6fe0e8}
.herolook{display:flex;gap:14px;align-items:center;justify-content:center;padding:8px;background:#120b1c;border:3px solid #1b1226}
.loot{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;justify-content:center;margin:10px 0}
.chestbox{text-align:center;font-size:12px;width:76px}
.chestbox .pop{animation:pop .5s steps(4) both}@keyframes pop{0%{transform:translateY(8px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.shine{animation:sh .6s steps(2) infinite}@keyframes sh{50%{opacity:.3}}
/* 日報もドット文字に */
.np,.np h1,.np h2,.np h3,.np p,.np td,.np th,.np li,.np .quote,.np .kicker,.np .small,.np .sub,.np .en,.np .topline,.np .foot,.np .ad{font-family:"DotGothic16","Hiragino Sans","Yu Gothic",sans-serif!important;font-weight:400!important;-webkit-font-smoothing:none;text-shadow:none}
.np{border-radius:0;border:4px solid #1b1226;box-shadow:inset 0 0 0 2px #b9ab88,4px 4px 0 #0008;line-height:1.75}
.np .mast h1{letter-spacing:.12em;text-shadow:3px 3px 0 #b9ab88}
.np .headline h2{font-size:clamp(20px,5.4vw,34px);line-height:1.35;text-shadow:2px 2px 0 #d9cca9;word-break:keep-all;overflow-wrap:anywhere}
.np .kicker{letter-spacing:.1em;border:2px solid #1b1226}
.np .main p{text-align:left;font-size:15px;letter-spacing:.02em}
.np .main p.lead::first-letter{font-size:2.4em;line-height:1;padding:2px 6px 0 0}
.np h3{font-size:15px;border-bottom:3px solid var(--rule);letter-spacing:.05em}
.np .quote{border-left:6px solid var(--accent);font-size:16px}
.np .box{border:3px solid var(--rule);box-shadow:inset 0 0 0 1px #b9ab88}
.np .ad{border:4px double var(--rule)}
.np .bar{border-radius:0;height:10px}
.np td:first-child,.np th:first-child{white-space:nowrap}
/* タブは最下段に固定 */
.wrap{padding-bottom:110px}
#tabs.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;margin:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:#161022;border-top:4px solid #1b1226;box-shadow:0 -2px 0 #5a4a78;justify-content:center}
#tabs.tabs button{max-width:110px}
/* 上部(タイトルとステータス)を固定 */
#top{position:sticky;top:0;z-index:6;background:#161022;margin:0 -14px;padding:4px 14px 2px;border-bottom:4px solid #1b1226;box-shadow:0 2px 0 #5a4a78}
#top .card{margin:6px 0 4px}
#top h1{margin:2px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <div id="top"><h1>百層日報</h1>
  <div class="sub">みんなで登る、平日の昼に動く塔</div>
  <div id="head"></div></div>

  <div id="login" class="card hide">
    <h2>はじめる</h2>
    <p class="dim" style="margin-top:0">登録なしですぐに遊べます。IDの登録は、あとからでもできます。</p>
    <div class="row"><button class="primary grow" id="btnGuest">はじめから(ゲストで始める)</button></div>
    <div style="margin-top:14px" class="dim">すでにIDがある場合</div>
    <div class="row" style="margin-top:6px">
      <input id="liMail" type="email" placeholder="メールアドレス" class="grow">
      <input id="liPass" type="password" placeholder="パスワード" class="grow">
      <button id="btnLogin">ログイン</button>
    </div>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="app" class="hide">
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </div>
</div>
<div id="story" class="hide"></div>

<script>

const S = { user: null, p: null, bag: [], defs: null, log: null, view: "town", floor: 1, msg: "", err: false, result: null, run: null, lines: [] };

let storyTimer = null;
function playStory(scenes, onEnd) {
  const el = $("story"); el.classList.remove("hide"); $("app").classList.add("hide"); $("login").classList.add("hide");
  let i = 0, typing = false, full = "", named = false;
  const askIdx = scenes.findIndex((x) => x.ask);
  const finish = () => { clearInterval(storyTimer); el.classList.add("hide"); onEnd(); };
  const show = () => {
    const sc = scenes[i]; const name = S.p ? S.p.name : "旅人";
    full = sc.t.split(NAME).join(name);
    el.innerHTML = `<button class="skip" id="skip">スキップ</button><div class="frame"><div class="stage">${bgSvg(sc.bg)}</div>
      <div class="box" id="box">${sc.who ? `<div class="who">${esc(sc.who)}</div>${sc.who === "トマ" ? TOMA : ""}` : ""}
      <div class="txt" id="txt"></div>${sc.ask ? '<div class="ask hide" id="ask"><input id="nmIn" maxlength="10" placeholder="名前(10文字まで)" value="" style="width:60%"> <button class="primary" id="nmOk">決定</button></div>' : ""}
      <div class="next" id="nx">▼</div></div></div>`;
    $("skip").onclick = (e) => { e.stopPropagation(); if (askIdx >= 0 && !named && i < askIdx) { i = askIdx; show(); return; } finish(); };
    const txt = $("txt"); let k = 0; typing = true; $("nx").classList.add("hide");
    clearInterval(storyTimer);
    storyTimer = setInterval(() => { k++; txt.textContent = full.slice(0, k); if (k >= full.length) done(); }, 32);
    const done = () => { clearInterval(storyTimer); typing = false; txt.textContent = full; if (sc.ask) { $("ask").classList.remove("hide"); $("nmIn").focus(); } else $("nx").classList.remove("hide"); };
    $("box").onclick = () => { if (typing) { done(); return; } if (sc.ask) return; next(); };
    if (sc.ask) $("nmOk").onclick = async (e) => {
      e.stopPropagation();
      const nm = $("nmIn").value.trim().slice(0, 10) || "旅人";
      const { error } = await sb.from("players").update({ name: nm }).eq("user_id", S.user.id);
      if (error) return alert("名前を保存できませんでした: " + error.message);
      S.p.name = nm; named = true; next();
    };
  };
  const next = () => { i++; if (i >= scenes.length) finish(); else show(); };
  show();
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("login").classList.remove("hide"); $("app").classList.add("hide"); return; }
  S.user = session.user; $("login").classList.add("hide");
  await sb.rpc("t_ensure");
  const { data: defs, error } = await sb.rpc("t_defs");
  if (error) { alert("読み込みに失敗しました: " + error.message); return; }
  S.defs = defs;
  await loadAll();
  if (S.p.story < 1) return playStory(INTRO, async () => { await setStory(1); enterTown(); });
  enterTown();
}
async function setStory(n) { await sb.from("players").update({ story: n }).eq("user_id", S.user.id); S.p.story = n; }
async function loadAll() {
  const uid = S.user.id;
  const [p, b, l, pl, se, gu, tu, tn] = await Promise.all([
    sb.from("players").select("*").eq("user_id", uid).single(),
    sb.from("bag").select("*").eq("user_id", uid).order("created_at"),
    sb.from("logs").select("*").eq("user_id", uid).order("id", { ascending: false }).limit(1),
    sb.from("plans").select("*").eq("user_id", uid).maybeSingle(),
    sb.from("season").select("*").eq("id", 1).single(),
    sb.from("guardians").select("*").order("floor"),
    sb.from("turns").select("*").order("n", { ascending: false }).limit(1),
    sb.rpc("t_town"),
  ]);
  S.town = tn && tn.data ? tn.data : S.town || null;
  S.p = p.data; S.bag = b.data || []; S.log = (l.data || [])[0] ? l.data[0].body : null;
  S.planSaved = pl.data ? { go: pl.data.go, farm_floor: pl.data.farm_floor } : null;
  S.plan = pl.data || { go: "up" };
  if (S.plan.farm_floor && S.plan.farm_floor > S.p.frontier - 1) S.plan.farm_floor = null;
  if (S.plan.go === "stay" && !S.plan.farm_floor) S.plan.go = "up";
  S.season = se.data; S.guardians = gu.data || []; S.turn = (tu.data || [])[0] || null;
}

function farmHtml(p, pl) {
  const fm = (S.season && S.season.farm) || null;
  const hot = fm ? fm.floors : {};
  const cur = pl.go === "stay" ? pl.farm_floor : null;
  const chips = Array.from({ length: Math.max(0, p.frontier - 1) }, (_, i) => i + 1).map((f) =>
    `<button data-ff="${f}" class="${cur === f ? "on" : ""}">${hot[f] ? "◎" : ""}${f}F</button>`).join("");
  const rows = Object.entries(hot).map(([f, v]) => [+f, v]).filter(([f]) => f <= p.frontier - 1).sort((a, b) => b[0] - a[0]).map(([f, v]) => {
    const lines = v.items.map((it) => {
      const miss = ((p.pity || {})[f + ":" + it.id]) || 0, rate = Math.min(fm.cap, it.base + fm.step * miss);
      return `「${esc(itemName(it.id))}」 ${(rate * 100).toFixed(1)}%${miss ? `(${miss}回連続ハズレ中)` : ""}`;
    }).join(" ／ ");
    return `<button data-ff="${f}" class="${cur === f ? "on" : ""}" style="display:block;width:100%;text-align:left;margin-top:5px;padding:8px"><b>◎ ${f}階 ${esc(v.name)}</b><div class="sub">${lines}。外すほど確率が上がる。</div></button>`;
  }).join("");
  return `<div style="margin-top:12px"><b>階を指定して稼ぐ</b><span class="dim"> 突破した階を、くり返し周回します</span></div>

const facOf = (id) => ((S.town || {}).facilities || []).find((x) => x.id === id);

function towerHtml(p, pl) {
  const fm = (S.season && S.season.farm) || null, hot = fm ? fm.floors : {};
  const cur = pl.go === "stay" && pl.farm_floor ? pl.farm_floor : p.frontier;
  let rows = "";
  for (let f = p.frontier + 1; f >= 1; f--) {

    const need = h && h.need, locked = !!(need && Object.entries(need).some(([k, v]) => facLv(k) < v));
    const sel = !fog && !locked && f === cur;
    let mid = "";

    else if (front && g && !g.defeated) mid = `${PX.icon("dragon", 34)}<span>守護者 ${esc(g.name)}<div class="hp"><i style="width:${Math.round((g.hp / g.mhp) * 100)}%"></i></div></span>`;

const resLabel = { clear: ["踏破!", "res-clear"], return: ["帰還", "res-retreat"], dead: ["倒れた…", "res-faint"], guardian: ["守護者戦", "res-retreat"], retreat: ["撤退", "res-retreat"], faint: ["倒れた…", "res-faint"] };
function jackpotHtml(b) {

function logSummary(b) {

function logSummary2(b) {

  return `<div class="kv"><b>${b.floor}階</b><span class="${c}">${t}${b.result === "dead" && b.cause ? `(${esc(b.cause)})` : ""}</span><b>経験値</b><span>+${b.exp_gain}${b.lv1 > b.lv0 ? ` <span class="lv">Lv${b.lv0}→${b.lv1}</span>` : ""}</span>

    ${b.result === "dead" && b.lost_items ? `<b>失った物</b><span class="res-faint">拾い物 ${b.lost_items}個</span>` : ""}
    ${b.turn ? `<b>ターン</b><span>第${b.turn}ターン</span>` : ""}</div>`;
}
function lootHtml(b) {

    + (b.items || []).map((n, i) => `<div class="chestbox"><div class="pop" style="display:inline-block;animation-delay:${i * .15}s">${PX.icon("chest_closed", 48)}</div><div>${esc(n)}</div></div>`).join("");
  return chests ? `<div class="loot">${chests}</div>` : "";
}
function tipOf(b) {
  const p = S.p, lv = b.lv1 || lvOf(p.exp);
  if (b.result === "dead" || b.result === "faint" || (b.result === "guardian" && b.dead)) {
    if (b.result === "guardian") return "守護者は強い。装備を整えて、レベルを上げてから挑むと、与えるダメージが増える。";
    if (p.herbs < 3) return "薬草が少なかった。道具屋で買い足しておくと、倒れにくくなる。";
    if (b.floor >= lv * 1.2) return "この階には、まだ早かったかもしれない。突破した階で稼いで、レベルを上げよう。";
    return "運が悪かった。装備を見直して、もう一度挑もう。";
  }
  if ((b.jackpot || []).length) return "大当たり! 装備は自動で付け替わる。持ち物で確認しよう。";

  if (b.result === "guardian") return "ダメージは全員の分が合算される。明日も、削り続けよう。";
  return `次のレベルまで、あと ${nextExp(lvOf(p.exp)) - p.exp}。`;
}

      <div class="sub" style="text-align:center;margin-top:4px">攻撃力 ${wAtk(w)} ／ 防御力 ${sDef(s)}　※戻ると、いちばん強い物が自動で装備されます</div></div>
    <div class="card"><h2>持ち物 (${S.bag.length}/${max}) ・ 薬草 ${p.herbs}個</h2><div class="inv">${cells}</div>
      <div class="panel">${sel ? `<div class="row">${PX.item(sel.def_id, 40)}<div class="grow"><b>${esc(nameOf(sel))}</b> ${itemInfo(sel)}<div class="sub">${esc(defOf(sel.def_id).note || "")}</div></div><button class="primary" id="eqb" ${on ? "disabled" : ""}>${on ? "装備中" : "装備"}</button></div>` : '<span class="dim">道具をタップすると、くわしく見られます。</span>'}</div></div>`;
  $("view").querySelectorAll("[data-pick]").forEach((b) => b.onclick = () => { S.sel = b.dataset.pick; S.msg = ""; render(); });
  if ($("eqb")) $("eqb").onclick = async () => {
    const { data, error } = await sb.rpc("t_equip", { p_item: sel.id });
    if (error) return say(error.message, true);
    await loadAll(); say(data.msg, !data.ok);
  };
}

/* ================= ログイン ================= */
$("btnGuest").onclick = async () => {
  const { error } = await sb.auth.signInAnonymously();
  if (error) { $("loginMsg").className = "msg err"; $("loginMsg").textContent = "ゲスト開始に失敗: " + error.message; return; }
  boot();
};
$("btnLogin").onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $("liMail").value.trim(), password: $("liPass").value });
  if (error) { $("loginMsg").className = "msg err"; $("loginMsg").textContent = "ログインできません: " + error.message; return; }
  boot();
};
boot();
</script>
