<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>百層週報 — 試しの塔</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0f1117;--panel:#1a1d27;--line:#2c3140;--ink:#ebe8df;--dim:#8d91a0;--gold:#d9b45b;--red:#d9625b;--green:#6fbf8c;--blue:#6aa6d9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Hiragino Sans","Yu Gothic",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 80px}
h1{font:600 20px/1 "Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.2em;margin:6px 0 2px;color:var(--gold)}
.sub{color:var(--dim);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.card h2{font-size:13px;margin:0 0 8px;color:var(--dim);font-weight:600;letter-spacing:.08em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
button,input{font:inherit;color:var(--ink);background:#252937;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button{cursor:pointer}
button.primary{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
button.on{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:600}
button:disabled{opacity:.45;cursor:default}
.tabs{display:flex;gap:4px;margin:8px 0}
.tabs button{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.kv b{color:var(--dim);font-weight:400}
.item{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.item:first-child{border-top:0}
.item .nm{flex:1}
.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--dim)}
.msg{min-height:1.5em;color:var(--green);font-size:13px}
.msg.err{color:var(--red)}
.log{font-size:13px;color:#cfccc0;background:#0c0e14;border-radius:8px;padding:8px 12px;margin-top:6px}
.log div{padding:1px 0}
.floors{display:flex;gap:6px;flex-wrap:wrap}
.floors button{min-width:44px;padding:8px 6px}
.hide{display:none!important}
.dim{color:var(--dim)}
.lv{color:var(--gold);font-weight:600}
.bar{height:8px;background:#0c0d12;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--gold)}
.res-clear{color:var(--green)}.res-retreat{color:var(--gold)}.res-faint{color:var(--red)}
/* 紙芝居 */
#story{position:fixed;inset:0;background:#000;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center}
#story .frame{width:100%;max-width:560px}
#story .stage{width:100%;aspect-ratio:400/220;background:#000;overflow:hidden}
#story .stage svg{width:100%;height:100%;display:block}
#story .box{position:relative;margin:0 10px;margin-top:-14px;background:rgba(18,20,30,.96);border:2px solid #cdbb88;border-radius:10px;padding:14px 16px 26px;min-height:150px;cursor:pointer}
#story .who{position:absolute;top:-13px;left:14px;background:#cdbb88;color:#1a1405;font-weight:700;font-size:13px;padding:1px 12px;border-radius:6px}
#story .txt{font-size:16px;line-height:1.9;min-height:84px;white-space:pre-wrap}
#story .next{position:absolute;right:14px;bottom:6px;color:#cdbb88;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
#story .ask{margin-top:8px}
#story .skip{position:fixed;top:10px;right:12px;font-size:12px;background:transparent;border:1px solid #444;color:#999}
.portrait{position:absolute;right:12px;top:-62px;width:64px;height:64px}
</style>
</head>
<body>
<div class="wrap">
  <h1>百層週報</h1>
  <div class="sub">みんなで登る、週替わりの塔 ― 試しの塔</div>

  <div id="login" class="card hide">
    <h2>はじめる</h2>
    <p class="dim" style="margin-top:0">登録なしですぐに遊べます。IDの登録は、あとからでもできます。</p>
    <div class="row"><button class="primary grow" id="btnGuest">はじめから(ゲストで始める)</button></div>
    <div style="margin-top:14px" class="dim">すでにIDがある場合</div>
    <div class="row" style="margin-top:6px">
      <input id="liMail" type="email" placeholder="メールアドレス" class="grow">
      <input id="liPass" type="password" placeholder="パスワード" class="grow">
      <button id="btnLogin">ログイン</button>
    </div>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="app" class="hide">
    <div id="head"></div>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </div>
</div>
<div id="story" class="hide"></div>

<script>
const SB_URL = "https://mvtlmwgtfljiwxlkxqns.supabase.co";
const SB_KEY = "sb_publishable_8yTYnpCJ8LPEd2ZtRWRj8Q_m_CH87Gn"; // 公開してよいキー(権限はRLSで制限)
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S = { user: null, p: null, bag: [], defs: null, log: null, view: "town", floor: 1, msg: "", err: false, result: null };

/* 表示用の計算(本当の判定はサーバー側) */
const lvOf = (exp) => 1 + Math.floor(Math.sqrt(Math.max(exp, 0) / 6));
const maxHp = (lv) => 20 + 6 * lv;
const nextExp = (lv) => 6 * lv * lv;
const defOf = (id) => (S.defs.weapons[id] || S.defs.shields[id] || { name: id });
const itemInfo = (b) => { const d = defOf(b.def_id); return b.kind === "W" ? `攻撃力${d.atk}` : `防御力${d.def}`; };

/* ================= 紙芝居 ================= */
const NAME = "{name}";
const INTRO = [
  { bg: "dark", t: "……" },
  { bg: "dark", t: "……おい。聞こえるか。" },
  { bg: "dark", t: "目が覚めたか、旅人よ。" },
  { bg: "town", t: "あなたが目を開けると、そこは見知らぬ街の広場だった。" },
  { bg: "town", t: "石畳の向こう。雲を突き抜けて、天高くそびえる塔が見える。" },
  { bg: "town", who: "トマ", t: "やっと起きたな。広場のど真ん中で倒れてたんだぞ。" },
  { bg: "town", who: "トマ", t: "……何も覚えてない、って顔だな。無理もない。この街に来る者は、みんなそうだ。" },
  { bg: "town", who: "トマ", t: "俺はトマ。この街で道具屋をやってる。で、あんたの名前は?", ask: "name" },
  { bg: "town", who: "トマ", t: `${NAME}か。いい名前だ。` },
  { bg: "tower", who: "トマ", t: "あれが「百層の塔」だ。登る者を、ずっと待ち続けている。" },
  { bg: "tower", who: "トマ", t: `この街に流れ着いた者は、いつか必ずあの塔に登ることになる。……あんたもだ、${NAME}。` },
  { bg: "tower", who: "トマ", t: "だが、いきなり百層は無茶だ。まずは街はずれの「試しの塔」で腕を磨け。" },
  { bg: "trial", who: "トマ", t: "試しの塔は10階建てだ。最上階の守護者を倒せば、一人前と認められる。" },
  { bg: "trial", who: "トマ", t: "冒険のやり方を教えてやる。塔に入って、モンスターを倒す。金や、拾い物が手に入る。" },
  { bg: "trial", who: "トマ", t: "戻ったら、要らない物は俺の店で売れ。その金で、もっといい武器や盾を買うんだ。" },
  { bg: "trial", who: "トマ", t: "薬草は命綱だ。傷が深くなったら、自分で使う。足りなくなったら、無理せず引き返せよ。" },
  { bg: "trial", who: "トマ", t: "倒れちまうと、その冒険で手に入れた物は、全部なくなるからな。" },
  { bg: "trial", who: "トマ", t: "ほら、餞別だ。木の棒と、皮の盾と、薬草を3つ。" },
  { bg: "trial", t: "木の棒、皮の盾、薬草×3、30Gを手に入れた。" },
  { bg: "trial", who: "トマ", t: "さあ、行ってこい!" },
];
const ENDING = [
  { bg: "trial", who: "トマ", t: `……やったな、${NAME}。試しの塔の守護者を倒しちまうとはな。` },
  { bg: "trial", who: "トマ", t: "これで一人前だ。守護者が守っていた宝は、あんたのもんだ。" },
  { bg: "tower", who: "トマ", t: "だが、本当の塔はこれからだ。百層の塔の扉が開く日は、近い。" },
  { bg: "tower", who: "トマ", t: "その時は、他の登る者たちと一緒にな。" },
  { bg: "tower", t: "試しの塔、踏破!\n―― 百層の塔の物語は、つづく。" },
];

function bgSvg(kind) {
  const stars = [[30,20],[80,50],[130,15],[200,35],[260,18],[320,45],[370,22],[60,90],[350,100],[290,70],[150,60]].map(([x,y]) => `<circle cx="${x}" cy="${y}" r="1.2" fill="#fff" opacity=".7"/>`).join("");
  const win = (x, y0, n, gap) => Array.from({ length: n }, (_, i) => `<rect x="${x}" y="${y0 + i * gap}" width="3" height="5" fill="#ffd98a" opacity="${i % 3 ? .9 : .35}"/>`).join("");
  if (kind === "dark") return `<svg viewBox="0 0 400 220"><rect width="400" height="220" fill="#000"/></svg>`;
  if (kind === "town") return `<svg viewBox="0 0 400 220"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141a36"/><stop offset="1" stop-color="#4a3b55"/></linearGradient></defs>
    <rect width="400" height="220" fill="url(#g1)"/>${stars}
    <polygon points="190,0 210,0 218,170 182,170" fill="#2a2f48"/>${win(196, 20, 12, 12)}
    <ellipse cx="200" cy="40" rx="70" ry="9" fill="#6b6a86" opacity=".5"/><ellipse cx="205" cy="110" rx="90" ry="10" fill="#6b6a86" opacity=".35"/>
    <rect y="165" width="400" height="55" fill="#1b1a24"/>
    <polygon points="20,165 20,135 45,118 70,135 70,165" fill="#23212f"/><rect x="38" y="145" width="8" height="10" fill="#ffd98a"/>
    <polygon points="300,165 300,140 330,120 360,140 360,165" fill="#23212f"/><rect x="322" y="148" width="8" height="10" fill="#ffd98a"/>
    <polygon points="95,165 95,150 115,138 135,150 135,165" fill="#1f1d2a"/></svg>`;
  if (kind === "tower") return `<svg viewBox="0 0 400 220"><defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1030"/><stop offset="1" stop-color="#5a4660"/></linearGradient></defs>
    <rect width="400" height="220" fill="url(#g2)"/>${stars}
    <polygon points="150,0 250,0 290,220 110,220" fill="#2b3150"/><polygon points="200,0 250,0 290,220 200,220" fill="#232842"/>
    ${win(170, 12, 15, 13)}${win(215, 18, 14, 14)}${win(240, 30, 12, 15)}
    <ellipse cx="200" cy="60" rx="110" ry="10" fill="#7a7a98" opacity=".45"/><ellipse cx="190" cy="140" rx="130" ry="12" fill="#7a7a98" opacity=".35"/></svg>`;
  return `<svg viewBox="0 0 400 220"><defs><linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2f55"/><stop offset="1" stop-color="#6d5a63"/></linearGradient></defs>
    <rect width="400" height="220" fill="url(#g3)"/>${stars}
    <rect y="170" width="400" height="50" fill="#1b1a24"/>
    <polygon points="170,170 175,60 225,60 230,170" fill="#3a3d58"/><rect x="165" y="52" width="70" height="10" fill="#4a4e6e"/>
    <polygon points="180,52 190,32 200,52" fill="#4a4e6e"/><polygon points="205,52 215,36 225,52" fill="#4a4e6e"/>
    <rect x="196" y="140" width="8" height="30" fill="#14131c"/>${win(182, 78, 6, 14)}${win(213, 84, 5, 16)}
    <line x1="200" y1="32" x2="200" y2="12" stroke="#cdbb88"/><polygon points="200,12 216,17 200,22" fill="#d9625b"/></svg>`;
}
const TOMA = `<svg class="portrait" viewBox="0 0 64 64"><rect width="64" height="64" rx="8" fill="#2a2430"/><circle cx="32" cy="34" r="17" fill="#d9a77a"/>
  <path d="M14 30 Q32 6 50 30 Q44 18 32 18 Q20 18 14 30Z" fill="#9a9aa6"/><circle cx="26" cy="32" r="2" fill="#222"/><circle cx="38" cy="32" r="2" fill="#222"/>
  <path d="M22 41 Q32 36 42 41 Q36 47 32 44 Q28 47 22 41Z" fill="#9a9aa6"/></svg>`;

let storyTimer = null;
function playStory(scenes, onEnd) {
  const el = $("story"); el.classList.remove("hide"); $("app").classList.add("hide"); $("login").classList.add("hide");
  let i = 0, typing = false, full = "", named = false;
  const askIdx = scenes.findIndex((x) => x.ask);
  const finish = () => { clearInterval(storyTimer); el.classList.add("hide"); onEnd(); };
  const show = () => {
    const sc = scenes[i]; const name = S.p ? S.p.name : "旅人";
    full = sc.t.split(NAME).join(name);
    el.innerHTML = `<button class="skip" id="skip">スキップ</button><div class="frame"><div class="stage">${bgSvg(sc.bg)}</div>
      <div class="box" id="box">${sc.who ? `<div class="who">${esc(sc.who)}</div>${sc.who === "トマ" ? TOMA : ""}` : ""}
      <div class="txt" id="txt"></div>${sc.ask ? '<div class="ask hide" id="ask"><input id="nmIn" maxlength="10" placeholder="名前(10文字まで)" value="" style="width:60%"> <button class="primary" id="nmOk">決定</button></div>' : ""}
      <div class="next" id="nx">▼</div></div></div>`;
    $("skip").onclick = (e) => { e.stopPropagation(); if (askIdx >= 0 && !named && i < askIdx) { i = askIdx; show(); return; } finish(); };
    const txt = $("txt"); let k = 0; typing = true; $("nx").classList.add("hide");
    clearInterval(storyTimer);
    storyTimer = setInterval(() => { k++; txt.textContent = full.slice(0, k); if (k >= full.length) done(); }, 32);
    const done = () => { clearInterval(storyTimer); typing = false; txt.textContent = full; if (sc.ask) { $("ask").classList.remove("hide"); $("nmIn").focus(); } else $("nx").classList.remove("hide"); };
    $("box").onclick = () => { if (typing) { done(); return; } if (sc.ask) return; next(); };
    if (sc.ask) $("nmOk").onclick = async (e) => {
      e.stopPropagation();
      const nm = $("nmIn").value.trim().slice(0, 10) || "旅人";
      const { error } = await sb.from("players").update({ name: nm }).eq("user_id", S.user.id);
      if (error) return alert("名前を保存できませんでした: " + error.message);
      S.p.name = nm; named = true; next();
    };
  };
  const next = () => { i++; if (i >= scenes.length) finish(); else show(); };
  show();
}

/* ================= データ読み込み ================= */
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("login").classList.remove("hide"); $("app").classList.add("hide"); return; }
  S.user = session.user; $("login").classList.add("hide");
  await sb.rpc("t_ensure");
  const { data: defs, error } = await sb.rpc("t_defs");
  if (error) { alert("読み込みに失敗しました: " + error.message); return; }
  S.defs = defs;
  await loadAll();
  if (S.p.story < 1) return playStory(INTRO, async () => { await setStory(1); enterTown(); });
  if (S.p.trial_clear && S.p.story < 2) return playStory(ENDING, async () => { await setStory(2); enterTown(); });
  enterTown();
}
async function setStory(n) { await sb.from("players").update({ story: n }).eq("user_id", S.user.id); S.p.story = n; }
async function loadAll() {
  const uid = S.user.id;
  const [p, b, l] = await Promise.all([
    sb.from("players").select("*").eq("user_id", uid).single(),
    sb.from("bag").select("*").eq("user_id", uid).order("created_at"),
    sb.from("logs").select("*").eq("user_id", uid).order("id", { ascending: false }).limit(1),
  ]);
  S.p = p.data; S.bag = b.data || []; S.log = (l.data || [])[0] ? l.data[0].body : null;
  S.floor = Math.min(S.floor, S.p.frontier);
}
function enterTown() { $("story").classList.add("hide"); $("app").classList.remove("hide"); S.view = "town"; render(); }

/* ================= 画面 ================= */
function say(m, err) {
  if (/Failed to fetch|NetworkError|Load failed/i.test(String(m))) m = "通信に失敗しました。電波の良い所で、もう一度押してください。(押した内容はまだ反映されていません)";
  S.msg = m; S.err = !!err; render();
}
const msgHtml = () => `<div class="msg ${S.err ? "err" : ""}">${esc(S.msg)}</div>`;
const TABS = [["town", "町"], ["shop", "道具屋"], ["bag", "持ち物"]];

function render() {
  const p = S.p, lv = lvOf(p.exp);
  const w = S.bag.find((x) => x.id === p.weapon_id), s = S.bag.find((x) => x.id === p.shield_id);
  const pct = Math.round(((p.exp - 6 * (lv - 1) * (lv - 1)) / (nextExp(lv) - 6 * (lv - 1) * (lv - 1))) * 100);
  $("head").innerHTML = `<div class="card"><div class="row"><b>${esc(p.name)}</b><span class="lv">Lv${lv}</span><span class="tag">HP ${maxHp(lv)}</span><span class="grow"></span><b>${p.gold} G</b></div>
    <div class="bar" style="margin:6px 0"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></div>
    <div class="sub">次のレベルまで あと ${nextExp(lv) - p.exp} / 薬草 ${p.herbs}個 / ${w ? esc(defOf(w.def_id).name) : "素手"} ・ ${s ? esc(defOf(s.def_id).name) : "盾なし"}</div></div>`;
  $("tabs").innerHTML = TABS.map(([k, n]) => `<button data-k="${k}" class="${S.view === k ? "on" : ""}">${n}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach((b) => b.onclick = () => { S.view = b.dataset.k; S.msg = ""; S.result = null; render(); });
  ({ town: viewTown, shop: viewShop, bag: viewBag })[S.view]();
}

function viewTown() {
  const p = S.p;
  if (S.result) return viewResult();
  const top = S.defs.top;
  const chips = Array.from({ length: Math.min(p.frontier, top) }, (_, i) => i + 1).map((f) =>
    `<button data-f="${f}" class="${S.floor === f ? "on" : ""}">${f === top ? "10F 守護者" : f + "F"}</button>`).join("");
  $("view").innerHTML = `
    <div class="card"><h2>試しの塔</h2>
      <div class="sub">${p.trial_clear ? "踏破済み。何度でも挑めます。" : "10階の守護者を倒せば、試しの塔は踏破です。"}</div>
      <div class="floors" style="margin-top:8px">${chips}</div>
      <div style="margin-top:12px"><button class="primary" id="go">${S.floor}階へ 冒険に出る</button></div>${msgHtml()}</div>
    ${p.trial_clear ? `<div class="card"><h2>百層の塔</h2><div class="dim">扉が開く日を待っている……(準備中)</div></div>` : ""}
    ${S.log ? `<div class="card"><h2>前回の冒険</h2>${logSummary(S.log)}</div>` : ""}
    <div class="card"><h2>アカウント</h2>
      ${S.user.is_anonymous ? `<div class="dim">ゲスト中です。ブラウザやスマホを変えても続けるには、IDを登録してください。</div>
      <div class="row" style="margin-top:6px"><input id="rgMail" type="email" placeholder="メールアドレス" class="grow"><input id="rgPass" type="password" placeholder="パスワード(8文字以上)" class="grow"><button id="btnReg">登録</button></div>`
      : `<div class="sub">ID登録済み: ${esc(S.user.email)}</div>`}
      <div style="margin-top:10px" class="row"><button id="btnOut">ログアウト</button><button id="btnReset">最初からやり直す</button></div>
      <div class="sub">「最初からやり直す」を押すと、このキャラクターのデータが消えて、オープニングからになります。</div></div>`;
  $("view").querySelectorAll(".floors button").forEach((b) => b.onclick = () => { S.floor = +b.dataset.f; render(); });
  $("go").onclick = async () => {
    $("go").disabled = true;
    const { data, error } = await sb.rpc("t_explore", { p_floor: S.floor });
    if (error) return say(error.message, true);
    if (!data.ok) return say(data.msg, true);
    await loadAll(); if (data.result === "clear") S.floor = Math.min(S.p.frontier, S.defs.top); S.result = data; S.msg = ""; render();
  };
  if ($("btnReg")) $("btnReg").onclick = async () => {
    const { error } = await sb.auth.updateUser({ email: $("rgMail").value.trim(), password: $("rgPass").value });
    if (error) return say("登録できませんでした: " + error.message, true);
    const { data: { user } } = await sb.auth.getUser(); S.user = user;
    say("確認メールを送りました。メール内のリンクを開くと登録が完了します。");
  };
  $("btnOut").onclick = async () => { await sb.auth.signOut(); location.reload(); };
  $("btnReset").onclick = async () => {
    if (!confirm("このキャラクターのデータを消して、最初からやり直します。よろしいですか?")) return;
    const { error } = await sb.rpc("t_reset");
    if (error) return say("やり直せませんでした: " + error.message, true);
    location.reload();
  };
}
const resLabel = { clear: ["突破!", "res-clear"], retreat: ["撤退", "res-retreat"], faint: ["倒れた…", "res-faint"] };
function logSummary(b) {
  const [t, c] = resLabel[b.result] || ["", ""];
  return `<div class="kv"><b>${b.floor}階</b><span class="${c}">${t}</span><b>経験値</b><span>+${b.exp_gain}${b.lv1 > b.lv0 ? ` <span class="lv">Lv${b.lv0}→${b.lv1}</span>` : ""}</span>
    <b>お金</b><span>${b.result === "faint" ? `<span class="res-faint">${b.lost_gold}G を失った</span>` : "+" + b.gold_gain + "G"}</span>
    ${(b.items || []).length || b.herbs_found ? `<b>拾い物</b><span>${(b.items || []).map(esc).join("、")}${b.herbs_found ? " 薬草×" + b.herbs_found : ""}</span>` : ""}</div>`;
}
function viewResult() {
  const b = S.result;
  $("view").innerHTML = `<div class="card"><h2>${b.floor}階の冒険</h2>${logSummary(b)}
    <div class="log">${(b.lines || []).map((l) => `<div>${esc(l)}</div>`).join("")}</div>
    <div style="margin-top:12px"><button class="primary" id="back">${b.first_clear ? "つづき" : "町へ戻る"}</button></div></div>`;
  $("back").onclick = () => {
    S.result = null;
    if (b.first_clear) return playStory(ENDING, async () => { await setStory(2); enterTown(); });
    render();
  };
}

function viewShop() {
  const p = S.p, d = S.defs;
  const buyable = [...Object.entries(d.weapons).map(([id, x]) => ({ id, x, k: "W" })), ...Object.entries(d.shields).map(([id, x]) => ({ id, x, k: "S" }))].filter((o) => o.x.price > 0);
  const eq = new Set([p.weapon_id, p.shield_id]);
  $("view").innerHTML = `<div class="card"><h2>道具屋トマの店 ― 買う</h2>${msgHtml()}
      <div class="item"><div class="nm">薬草<div class="sub">HPを回復する。最大${d.herb.max}個まで。</div></div><b>${d.herb.price}G</b><button data-buy="herb" ${p.gold < d.herb.price || p.herbs >= d.herb.max ? "disabled" : ""}>買う</button></div>
      ${buyable.map((o) => `<div class="item"><div class="nm">${esc(o.x.name)} <span class="tag">${o.k === "W" ? "攻撃力" + o.x.atk : "防御力" + o.x.def}</span><div class="sub">${esc(o.x.note)}</div></div><b>${o.x.price}G</b><button data-buy="${o.id}" ${p.gold < o.x.price ? "disabled" : ""}>買う</button></div>`).join("")}</div>
    <div class="card"><h2>売る</h2>
      ${p.herbs > 0 ? `<div class="item"><div class="nm">薬草 ×${p.herbs}</div><b>${d.herb.sell}G</b><button data-herb="1">売る</button></div>` : ""}
      ${S.bag.map((b) => `<div class="item"><div class="nm">${esc(defOf(b.def_id).name)} <span class="tag">${itemInfo(b)}</span>${eq.has(b.id) ? ' <span class="tag">装備中</span>' : ""}</div><b>${defOf(b.def_id).sell}G</b><button data-sell="${b.id}" ${eq.has(b.id) ? "disabled" : ""}>売る</button></div>`).join("") || '<div class="dim">売れる物がありません。</div>'}</div>`;
  const run = async (fn, args) => { const { data, error } = await sb.rpc(fn, args); if (error) return say(error.message, true); await loadAll(); say(data.msg, !data.ok); };
  $("view").querySelectorAll("[data-buy]").forEach((b) => b.onclick = () => run("t_buy", { p_def: b.dataset.buy }));
  $("view").querySelectorAll("[data-sell]").forEach((b) => b.onclick = () => run("t_sell", { p_item: b.dataset.sell }));
  $("view").querySelectorAll("[data-herb]").forEach((b) => b.onclick = () => run("t_sell_herb", {}));
}

function viewBag() {
  const p = S.p;
  const line = (b) => { const on = b.id === p.weapon_id || b.id === p.shield_id;
    return `<div class="item"><div class="nm">${esc(defOf(b.def_id).name)} <span class="tag">${itemInfo(b)}</span>${on ? ' <span class="tag">装備中</span>' : ""}<div class="sub">${esc(defOf(b.def_id).note)}</div></div>
      <button data-eq="${b.id}" ${on ? "disabled" : ""}>装備</button></div>`; };
  $("view").innerHTML = `<div class="card"><h2>持ち物 (${S.bag.length}/${S.defs.bag_max}) ・ 薬草 ${p.herbs}個</h2>${msgHtml()}
      <div class="sub">冒険から戻ると、いちばん強い武器と盾が自動で装備されます。</div></div>
    <div class="card"><h2>武器</h2>${S.bag.filter((b) => b.kind === "W").map(line).join("") || '<div class="dim">なし</div>'}</div>
    <div class="card"><h2>盾</h2>${S.bag.filter((b) => b.kind === "S").map(line).join("") || '<div class="dim">なし</div>'}</div>`;
  $("view").querySelectorAll("[data-eq]").forEach((b) => b.onclick = async () => {
    const { data, error } = await sb.rpc("t_equip", { p_item: b.dataset.eq });
    if (error) return say(error.message, true);
    await loadAll(); say(data.msg, !data.ok);
  });
}

/* ================= ログイン ================= */
$("btnGuest").onclick = async () => {
  const { error } = await sb.auth.signInAnonymously();
  if (error) { $("loginMsg").className = "msg err"; $("loginMsg").textContent = "ゲスト開始に失敗: " + error.message; return; }
  boot();
};
$("btnLogin").onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $("liMail").value.trim(), password: $("liPass").value });
  if (error) { $("loginMsg").className = "msg err"; $("loginMsg").textContent = "ログインできません: " + error.message; return; }
  boot();
};
boot();
</script>
</body>
</html>
