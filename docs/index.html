<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>百層週報</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#12141a;--panel:#1b1e27;--line:#2c3140;--ink:#e8e6df;--dim:#8d91a0;--gold:#d9b45b;--red:#d9625b;--green:#6fbf8c;--blue:#6aa6d9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Hiragino Sans","Yu Gothic",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 80px}
h1{font:600 20px/1 "Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.2em;margin:6px 0 2px;color:var(--gold)}
.sub{color:var(--dim);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.card h2{font-size:13px;margin:0 0 8px;color:var(--dim);font-weight:600;letter-spacing:.08em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.bar{height:10px;background:#0c0d12;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#e8935b)}
.tabs{display:flex;gap:4px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2;overflow-x:auto}
.tabs button{flex:1;min-width:64px}
button,select,input{font:inherit;color:var(--ink);background:#252937;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
button{cursor:pointer}
button.on{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:600}
button.primary{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:600}
button:disabled{opacity:.5}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
.kv b{color:var(--dim);font-weight:400}
.item{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.item:first-child{border-top:0}
.item .nm{flex:1}
.r1{color:var(--ink)}.r2{color:var(--blue)}.r3{color:var(--gold)}
.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--dim)}
.msg{min-height:1.5em;color:var(--green);font-size:13px}
.msg.err{color:var(--red)}
.log{font-size:13px;color:#c9c6bb;white-space:pre-wrap;background:#0f1117;border-radius:8px;padding:8px 10px;margin-top:6px}
details summary{cursor:pointer}
.hide{display:none}
.dim{color:var(--dim)}
.lv{color:var(--gold);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>百層週報</h1>
  <div class="sub">みんなで登る、週替わりの塔</div>

  <div id="login" class="card hide">
    <h2>はじめる</h2>
    <p class="dim" style="margin-top:0">ゲストならすぐ遊べます。ID登録は後からでもできます。</p>
    <div class="row">
      <button class="primary grow" id="btnGuest">ゲストで始める</button>
    </div>
    <div style="margin-top:14px" class="dim">すでにIDがある場合</div>
    <div class="row" style="margin-top:6px">
      <input id="liMail" type="email" placeholder="メールアドレス" class="grow">
      <input id="liPass" type="password" placeholder="パスワード" class="grow">
      <button id="btnLogin">ログイン</button>
    </div>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="app" class="hide">
    <div class="card" id="towerCard"></div>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </div>
</div>

<script>
const SB_URL = "https://mvtlmwgtfljiwxlkxqns.supabase.co";
const SB_KEY = "sb_publishable_8yTYnpCJ8LPEd2ZtRWRj8Q_m_CH87Gn"; // 公開してよいキー(権限はRLSで制限)
const sb = supabase.createClient(SB_URL, SB_KEY);

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state = { user: null, tower: null, prof: null, items: [], report: null, order: null, tab: "go", msg: "" };
const TABS = [["go","出撃"],["rep","結果"],["eq","装備"],["shop","店"],["tw","塔"]];
const JOBS = { war:"戦士", hun:"狩人", mag:"魔術師", mer:"商人", pri:"僧侶" };
const ELS = ["無","火","水","雷","風"];
const ACCS = { hp:"守りの指輪", gold:"商人の護符", hunt:"狩人の印", heal:"癒しの香炉" };

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("login").classList.remove("hide"); $("app").classList.add("hide"); return; }
  state.user = session.user;
  $("login").classList.add("hide"); $("app").classList.remove("hide");
  await loadAll();
  render();
}

async function loadAll() {
  const uid = state.user.id;
  const [t, p, it, rp, od] = await Promise.all([
    sb.from("tower").select("*").eq("id", 1).single(),
    sb.from("profiles").select("*").eq("user_id", uid).single(),
    sb.from("items").select("*").eq("user_id", uid).order("created_at", { ascending: false }),
    sb.from("reports").select("*").eq("user_id", uid).order("turn", { ascending: false }).limit(1),
    sb.from("orders").select("*").eq("user_id", uid).order("turn", { ascending: false }).limit(1),
  ]);
  state.tower = t.data; state.prof = p.data; state.items = it.data || [];
  state.report = (rp.data || [])[0] || null; state.order = (od.data || [])[0] || null;
}

function render() {
  renderTower();
  $("tabs").innerHTML = TABS.map(([k, n]) => `<button data-k="${k}" class="${state.tab === k ? "on" : ""}">${n}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach((b) => b.onclick = () => { state.tab = b.dataset.k; state.msg = ""; render(); });
  const v = { go: viewGo, rep: viewRep, eq: viewEq, shop: viewShop, tw: viewTower }[state.tab];
  v();
}

function renderTower() {
  const t = state.tower, p = state.prof;
  if (!t || !p) return;
  const b = t.boss;
  const pct = b && b.max ? Math.max(0, Math.round((b.hp / b.max) * 100)) : null;
  $("towerCard").innerHTML = `
    <div class="row"><b class="lv">第${t.turn}ターン</b><span class="tag">${t.phase === "master" ? "塔主あり" : "攻略中"}</span>
      <span class="grow"></span><button id="btnRefresh">更新</button></div>
    <div style="margin:6px 0">${esc(t.headline || "")}</div>
    ${b ? `<div class="sub">第${b.floor}層の守護者「${esc(b.name)}」(${esc(b.el)}属性) 残り ${pct}%</div>
    <div class="bar"><i style="width:${pct}%"></i></div>` : `<div class="sub">到達できる最上層: 第${t.front_floor}層</div>`}
    <div class="kv" style="margin-top:8px">
      <b>${esc(p.name)}</b><span>現在 第${p.floor}層 / 最高 第${p.best_floor}層 / ${p.gold}G / 薬${p.potions}${p.job ? " / " + JOBS[p.job] : ""}</span>
    </div>`;
  $("btnRefresh").onclick = async () => { await loadAll(); render(); };
}

function say(m, err) { state.msg = m; state.err = !!err; render(); }
const msgHtml = () => `<div class="msg ${state.err ? "err" : ""}">${esc(state.msg)}</div>`;

/* ---- 出撃 ---- */
function viewGo() {
  const cur = (state.order && state.order.policy) || {};
  const mode = cur.mode || "push", stance = cur.stance || "std", floor = cur.floor || 1;
  const p = state.prof;
  const weapons = state.items.filter((i) => i.kind === "W").sort((a, b) => ((b.data || {}).power || 0) - ((a.data || {}).power || 0));
  const prep = (Array.isArray(cur.prep) && cur.prep.length ? cur.prep : weapons.slice(0, 3).map((w) => w.id));
  $("view").innerHTML = `
    <div class="card"><h2>今回の方針 (第${state.tower.turn}ターン)</h2>
      ${state.order && state.order.turn === state.tower.turn ? '<div class="sub">提出済み。ターン処理まで何度でも変更できます。</div>' : '<div class="sub">未提出。出さなくても前回の方針で進みます。</div>'}
      <div class="dim" style="margin-top:8px">進み方</div>
      <div class="seg" id="mode"><button data-v="push" class="${mode === "push" ? "on" : ""}">最前線へ進む</button><button data-v="farm" class="${mode === "farm" ? "on" : ""}">下の階で稼ぐ</button></div>
      <div id="farmBox" class="${mode === "farm" ? "" : "hide"}" style="margin-top:8px">稼ぐ階 <input id="floor" type="number" min="1" max="${p.floor}" value="${Math.min(floor, p.floor)}" style="width:80px"> <span class="dim">(1〜${p.floor})</span></div>
      <div class="dim" style="margin-top:10px">戦い方</div>
      <div class="seg" id="stance">
        <button data-v="safe" class="${stance === "safe" ? "on" : ""}">慎重</button>
        <button data-v="std" class="${stance === "std" ? "on" : ""}">標準</button>
        <button data-v="bold" class="${stance === "bold" ? "on" : ""}">大胆</button></div>
      <div class="sub" style="margin-top:6px">慎重=薬を早めに使い、傷が深いと引き返す。大胆=強引に先へ進む。</div>
      <div class="dim" style="margin-top:10px">持っていく武器(最大3本)</div>
      <div id="prep">${weapons.map((w) => `<label class="item" style="cursor:pointer"><input type="checkbox" value="${w.id}" ${prep.includes(w.id) ? "checked" : ""}><span class="nm r${((w.data || {}).rar || 0) + 1}">${esc((w.data || {}).name)}${(w.data || {}).plus ? " +" + w.data.plus : ""}<span class="sub"> 威力${(w.data || {}).power}${(w.data || {}).el && w.data.el !== "無" ? " / " + w.data.el : ""}${(w.data || {}).trait ? " / " + esc(w.data.trait) : ""}</span></span></label>`).join("") || '<div class="dim">武器がありません。店で買いましょう。</div>'}</div>
      <div class="sub">属性の相性: 風→火→水→雷→風 の順に有利。敵の弱点を突ける武器を混ぜると強いです。</div>
      <div style="margin-top:12px"><button class="primary" id="btnSend">この方針で出す</button></div>
      ${msgHtml()}
    </div>
    <div class="card"><h2>名前・職業・ID</h2>
      <div class="row"><input id="nm" value="${esc(p.name)}" maxlength="12" class="grow"><button id="btnName">名前を変更</button></div>
      <div style="margin-top:10px" class="row">
        <select id="job" class="grow"><option value="">職業を選ぶ</option>${Object.entries(JOBS).map(([k, n]) => `<option value="${k}" ${p.job === k ? "selected" : ""}>${n}</option>`).join("")}</select>
        <button id="btnJob">決定</button></div>
      <div class="sub">${p.floor > 10 ? "転職には費用がかかります。" : "職業は第11層から選べます。"}</div>
      ${state.user.is_anonymous ? `<div style="margin-top:12px" class="dim">ゲスト中です。IDを登録するとデータを引き継げます。</div>
      <div class="row" style="margin-top:6px"><input id="rgMail" type="email" placeholder="メールアドレス" class="grow"><input id="rgPass" type="password" placeholder="パスワード(8文字以上)" class="grow"><button id="btnReg">登録</button></div>` : `<div class="sub" style="margin-top:10px">ID登録済み: ${esc(state.user.email)}</div>`}
      <div style="margin-top:10px"><button id="btnOut">ログアウト</button></div>
    </div>`;
  let m = mode, s = stance;
  document.querySelectorAll("#mode button").forEach((b) => b.onclick = () => { m = b.dataset.v; document.querySelectorAll("#mode button").forEach((x) => x.classList.toggle("on", x === b)); $("farmBox").classList.toggle("hide", m !== "farm"); });
  document.querySelectorAll("#stance button").forEach((b) => b.onclick = () => { s = b.dataset.v; document.querySelectorAll("#stance button").forEach((x) => x.classList.toggle("on", x === b)); });
  $("btnSend").onclick = async () => {
    const policy = { mode: m, stance: s, prep: [...document.querySelectorAll("#prep input:checked")].map((x) => x.value).slice(0, 3) };
    if (m === "farm") policy.floor = Math.max(1, Math.min(p.floor, parseInt($("floor").value || "1", 10)));
    const same = state.order && state.order.turn === state.tower.turn;
    const { error } = same
      ? await sb.from("orders").update({ policy, updated_at: new Date().toISOString() }).eq("user_id", state.user.id).eq("turn", state.tower.turn)
      : await sb.from("orders").insert({ user_id: state.user.id, turn: state.tower.turn, policy });
    if (error) return say("送信できませんでした: " + error.message, true);
    await loadAll(); say("方針を提出しました。");
  };
  $("btnName").onclick = async () => {
    const name = $("nm").value.trim(); if (!name) return;
    const { error } = await sb.from("profiles").update({ name }).eq("user_id", state.user.id);
    if (error) return say("変更できませんでした: " + error.message, true);
    await loadAll(); say("名前を変更しました。");
  };
  $("btnJob").onclick = async () => {
    const j = $("job").value; if (!j) return;
    const { data, error } = await sb.rpc("set_job", { p_job: j });
    if (error) return say(error.message, true);
    await loadAll(); say(data.msg + (data.cost ? ` (${data.cost}G)` : ""), !data.ok);
  };
  if ($("btnReg")) $("btnReg").onclick = async () => {
    const { error } = await sb.auth.updateUser({ email: $("rgMail").value.trim(), password: $("rgPass").value });
    if (error) return say("登録できませんでした: " + error.message, true);
    const { data: { user } } = await sb.auth.getUser(); state.user = user;
    say("確認メールを送りました。メール内のリンクを開くと登録が完了します。");
  };
  $("btnOut").onclick = async () => { await sb.auth.signOut(); location.reload(); };
}

/* ---- 結果 ---- */
function viewRep() {
  const r = state.report;
  if (!r) { $("view").innerHTML = `<div class="card"><h2>結果</h2><div class="dim">まだ結果がありません。方針を出して、ターンが進むのを待ちましょう。</div></div>`; return; }
  const b = r.body || {};
  const dives = b.dives || [];
  const lvUp = b.lv1 > b.lv0 ? `<span class="lv"> Lv${b.lv0}→Lv${b.lv1}</span>` : ` Lv${b.lv1}`;
  $("view").innerHTML = `
    <div class="card"><h2>第${r.turn}ターンの結果</h2>
      <div class="kv">
        <b>階層</b><span>第${b.floor0}層 → 第${b.floor1}層</span>
        <b>経験値</b><span>+${(b.exp1 || 0) - (b.exp0 || 0)}${lvUp}</span>
        <b>所持金</b><span>${b.gold0}G → ${b.gold1}G (${(b.gold1 - b.gold0 >= 0 ? "+" : "")}${b.gold1 - b.gold0})</span>
        ${b.boss_dmg ? `<b>守護者へ</b><span>${b.boss_dmg} ダメージ</span>` : ""}
      </div></div>
    ${dives.map((d) => `<div class="card"><details><summary>第${d.floor}層(${esc(d.el)}) — ${({clear:"突破",faint:"力尽きた",flee:"撤退"})[d.reason] || esc(d.reason)}　<span class="dim">${d.gold}G / EXP ${d.exp}${(d.drops || []).length ? " / 戦利品" + d.drops.length : ""}</span></summary>
      ${(d.drops || []).map((x) => `<div class="r${(x.rar || 0) + 1}">▸ ${esc(x.name)}</div>`).join("")}
      <div class="log">${esc((d.lines || []).join("\n"))}</div></details></div>`).join("")}`;
}

/* ---- 装備 ---- */
function itemLine(i) {
  const d = i.data || {}; const rar = (d.rar || 0) + 1;
  const eq = state.prof.armor_id === i.id || state.prof.acc_id === i.id;
  let spec = "";
  if (i.kind === "W") spec = `威力${d.power}${d.el && d.el !== "無" ? " / " + d.el : ""}${d.trait ? " / " + esc(d.trait) : ""}`;
  if (i.kind === "A") spec = `防御${d.def}${d.hp ? " HP+" + d.hp : ""}${d.el && d.el !== "無" ? " / " + d.el : ""}`;
  if (i.kind === "C") spec = esc(ACCS[d.kind] || "");
  return `<div class="item"><div class="nm r${rar}">${esc(d.name)}${d.plus ? " +" + d.plus : ""} ${eq ? '<span class="tag">装備中</span>' : ""}<div class="sub">${spec}</div></div>
    ${i.kind !== "W" ? `<button data-a="eq" data-id="${i.id}">装備</button>` : ""}<button data-a="up" data-id="${i.id}">強化</button><button data-a="sell" data-id="${i.id}">売る</button></div>`;
}
function viewEq() {
  const g = (k) => state.items.filter((i) => i.kind === k);
  $("view").innerHTML = `<div class="card"><h2>装備と持ち物</h2>${msgHtml()}
    <div class="sub">武器は「出撃」タブで、持っていく3本を選びます。</div></div>
    <div class="card"><h2>武器</h2>${g("W").map(itemLine).join("") || '<div class="dim">なし</div>'}</div>
    <div class="card"><h2>防具</h2>${g("A").map(itemLine).join("") || '<div class="dim">なし</div>'}</div>
    <div class="card"><h2>装飾品</h2>${g("C").map(itemLine).join("") || '<div class="dim">なし</div>'}</div>`;
  $("view").querySelectorAll("button[data-a]").forEach((b) => b.onclick = async () => {
    const fn = { eq: "set_equip", up: "shop_enhance", sell: "shop_sell" }[b.dataset.a];
    const { data, error } = await sb.rpc(fn, { p_item: b.dataset.id });
    if (error) return say(error.message, true);
    await loadAll(); say(data.msg || "完了", data.ok === false);
  });
}

/* ---- 店 ---- */
function viewShop() {
  const p = state.prof, T = 1 + Math.floor((p.floor - 1) / 5);
  const tiers = [...new Set([Math.max(1, T - 1), T, T + 1])];
  const elOpts = (p.floor > 10 ? ELS : ["無"]);
  $("view").innerHTML = `<div class="card"><h2>店</h2><div class="sub">所持金 ${p.gold}G / 薬 ${p.potions}個</div>${msgHtml()}
    <div class="row" style="margin-top:8px"><button data-k="P" data-t="0" data-e="無">薬を買う (25G)</button></div></div>
    <div class="card"><h2>武器・防具</h2>
      <div class="row"><select id="sTier">${tiers.map((t) => `<option value="${t}" ${t === T ? "selected" : ""}>ランク${t}${t === T + 1 ? " (高級品)" : ""}</option>`).join("")}</select>
      <select id="sEl">${elOpts.map((e) => `<option>${e}</option>`).join("")}</select></div>
      <div class="row" style="margin-top:8px"><button id="buyW">武器を買う</button><button id="buyA">防具を買う</button></div>
      ${p.floor <= 10 ? '<div class="sub">属性装備は第11層から買えます。</div>' : ""}</div>
    <div class="card"><h2>装飾品</h2>
      <div class="row"><select id="cKind">${Object.entries(ACCS).map(([k, n]) => `<option value="${k}">${n}</option>`).join("")}</select><button id="buyC">買う</button></div></div>`;
  const buy = async (kind, tier, el) => {
    const { data, error } = await sb.rpc("shop_buy", { p_kind: kind, p_tier: tier, p_el: el });
    if (error) return say(error.message, true);
    await loadAll(); say(data.msg, !data.ok);
  };
  $("view").querySelector("button[data-k=P]").onclick = () => buy("P", 0, "無");
  $("buyW").onclick = () => buy("W", +$("sTier").value, $("sEl").value);
  $("buyA").onclick = () => buy("A", +$("sTier").value, $("sEl").value);
  $("buyC").onclick = () => buy("C", T, $("cKind").value);
}

/* ---- 塔 ---- */
async function viewTower() {
  $("view").innerHTML = `<div class="card dim">読み込み中…</div>`;
  const t = state.tower;
  const [tl, ct] = await Promise.all([
    sb.from("timeline").select("*").order("id", { ascending: false }).limit(30),
    sb.from("contributions").select("*").eq("boss_floor", t.front_floor).order("dmg", { ascending: false }).limit(10),
  ]);
  $("view").innerHTML = `
    <div class="card"><h2>第${t.front_floor}層の守護者への貢献ランキング</h2>
      ${(ct.data || []).map((c, i) => `<div class="item"><span class="lv">${i + 1}</span><span class="nm">${esc(c.name)}${c.user_id === state.user.id ? ' <span class="tag">あなた</span>' : ""}</span><span>${c.dmg}</span></div>`).join("") || '<div class="dim">まだ誰も挑んでいません。</div>'}</div>
    <div class="card"><h2>塔の出来事</h2>
      ${(tl.data || []).map((x) => `<div class="item"><span class="tag">T${x.turn}</span><span class="nm">${esc(x.text)}</span></div>`).join("") || '<div class="dim">まだ何も起きていません。</div>'}</div>`;
}

/* ---- ログイン ---- */
$("btnGuest").onclick = async () => {
  const { error } = await sb.auth.signInAnonymously();
  if (error) { $("loginMsg").className = "msg err"; $("loginMsg").textContent = "ゲスト開始に失敗: " + error.message; return; }
  boot();
};
$("btnLogin").onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $("liMail").value.trim(), password: $("liPass").value });
  if (error) { $("loginMsg").className = "msg err"; $("loginMsg").textContent = "ログインできません: " + error.message; return; }
  boot();
};
boot();
</script>
</body>
</html>
